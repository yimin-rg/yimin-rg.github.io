<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yimin 個人網站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            background: 
                radial-gradient(circle at 20% 80%, rgba(34, 197, 94, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(16, 185, 129, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #bae6fd 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 霧化背景效果 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHZpZXdCb3g9IjAgMCAyMCAyMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KICA8ZGVmcz4KICAgIDxmaWx0ZXIgaWQ9Im5vaXNlIj4KICAgICAgPGZlVHVyYnVsZW5jZSB0eXBlPSJmcmFjdGFsTm9pc2UiIGJhc2VGcmVxdWVuY3k9IjAuOSIgbnVtT2N0YXZlcz0iNCIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPgogICAgPC9maWx0ZXI+CiAgPC9kZWZzPgogIDxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNub2lzZSkiIG9wYWNpdHk9IjAuMDMiLz4KPC9zdmc+'),
                radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(255, 255, 255, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
        }

        /* 導航欄 */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding: 1rem 2rem;
            z-index: 1000;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #059669;
            text-decoration: none;
            background: linear-gradient(135deg, #059669, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-item {
            cursor: pointer;
            padding: 0.7rem 1.2rem;
            border-radius: 15px;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            color: #475569;
            font-weight: 500;
            position: relative;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .nav-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 15px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
        }

        .nav-item:hover::before {
            opacity: 1;
        }

        .nav-item:hover {
            color: #059669;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            background: rgba(255, 255, 255, 0.5);
            border-color: rgba(255, 255, 255, 0.6);
        }

        .nav-item.active {
            background: rgba(255, 255, 255, 0.6);
            color: #059669;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        .nav-item.active::before {
            opacity: 0;
        }

        /* 主要內容區 */
        .main-content {
            margin-top: 80px;
            padding: 2rem;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        /* 首頁樣式 */
        .home-section {
            text-align: center;
            padding: 4rem 0;
        }

        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #059669;
            font-weight: bold;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.15),
                0 8px 16px rgba(0, 0, 0, 0.08);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
        }

        .profile-image::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.3));
            border-radius: 50%;
            z-index: -1;
            opacity: 0.8;
            filter: blur(8px);
        }

        .profile-image:hover {
            transform: scale(1.05) rotate(2deg);
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.2),
                0 12px 24px rgba(0, 0, 0, 0.12);
            background: rgba(255, 255, 255, 0.5);
            border-color: rgba(255, 255, 255, 0.7);
        }

        .intro-text {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        .intro-text h1 {
            font-size: 2.8rem;
            margin-bottom: 1rem;
            color: #1e293b;
            font-weight: 300;
            background: linear-gradient(135deg, #1e293b, #475569);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .intro-text p {
            font-size: 1.1rem;
            color: #64748b;
            line-height: 1.8;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }

        /* 卡片網格樣式 */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            padding: 2rem 0;
        }

        .content-card {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.1),
                0 1px 2px rgba(0, 0, 0, 0.05);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.4);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .content-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.2);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .content-card:hover::before {
            opacity: 1;
        }

        .content-card:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.15),
                0 8px 24px rgba(0, 0, 0, 0.1);
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.45);
        }

        .card-thumbnail {
            width: 100%;
            height: 200px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #059669;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .card-thumbnail::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s ease;
        }

        .content-card:hover .card-thumbnail::before {
            left: 100%;
        }

        .content-card:hover .card-thumbnail {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.5);
            border-color: rgba(255, 255, 255, 0.7);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }

        .card-summary {
            color: #64748b;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            font-size: 0.875rem;
            color: #94a3b8;
        }

        /* 頁面標題 */
        .page-title {
            text-align: center;
            margin-bottom: 3rem;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
        }

        .page-title h2 {
            font-size: 2.5rem;
            color: #1e293b;
            font-weight: 300;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #1e293b, #059669);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-title p {
            color: #64748b;
            font-size: 1.1rem;
        }

        /* 隱藏所有section */
        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .navbar {
                padding: 1rem;
                background: rgba(255, 255, 255, 0.5);
            }

            .nav-menu {
                gap: 1rem;
            }

            .nav-item {
                padding: 0.5rem 0.8rem;
                font-size: 0.9rem;
                background: rgba(255, 255, 255, 0.4);
            }

            .main-content {
                padding: 1rem;
            }

            .content-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .intro-text h1 {
                font-size: 2rem;
            }

            .page-title h2 {
                font-size: 2rem;
            }
        }

        /* 滾動動畫 */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 滾動條樣式 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.3);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 4px;
            backdrop-filter: blur(10px);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.7);
        }

        /* 特殊裝飾元素 */
        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: floatShapes 20s ease-in-out infinite;
        }

        .shape:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            width: 60px;
            height: 60px;
            top: 60%;
            right: 15%;
            animation-delay: 5s;
        }

        .shape:nth-child(3) {
            width: 100px;
            height: 100px;
            bottom: 20%;
            left: 20%;
            animation-delay: 10s;
        }

        .circle-img {
            width: 20vw;         /* 依照螢幕大小縮放 */
            height: 20vw;        /* 必須和 width 一樣 */
            max-width: 200px;    /* 最多 200px */
            max-height: 200px;
            object-fit: cover;
            border-radius: 50%;
        }
        .circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background-image: url("me_pic.jpg");
            background-size: cover;     /* 填滿 */
            background-position: center;/* 置中 */
        }




        @keyframes floatShapes {
            0%, 100% { transform: translateY(0px) translateX(0px) rotate(0deg); }
            33% { transform: translateY(-20px) translateX(10px) rotate(120deg); }
            66% { transform: translateY(10px) translateX(-5px) rotate(240deg); }
        }
    </style>
</head>
<body>
    <!-- 浮動裝飾形狀 -->
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <!-- 導航欄 -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo">Yimin</a>
            <ul class="nav-menu">
                <li class="nav-item active" onclick="showSection('home')">首頁</li>
                <li class="nav-item" onclick="showSection('projects')">專案</li>
                <li class="nav-item" onclick="showSection('uva')">UVA題庫</li>
                <li class="nav-item" onclick="showSection('notes')">筆記</li>
                <li class="nav-item" onclick="showSection('thoughts')">心得</li>
            </ul>
        </div>
    </nav>

    <!-- 主要內容 -->
    <main class="main-content">
        <!-- 首頁 -->
        <section id="home" class="section active">
            <div class="home-section fade-in">
                <div class="profile-image">
                    <div class="circle">
                    <img src="me_pic.jpg" class="circle-img" alt="我的照片">
                </div>
                </div>
                
                <div class="intro-text">
                    <h1>Hello, I'm Yimin</h1>
                    <p>歡迎來到我的個人網站！我是一名熱愛程式設計和學習的開發者。
                    在這裡你可以找到我的專案作品、程式練習記錄、學習筆記以及個人心得分享。
                    希望我的經驗和想法能夠對你有所幫助，也歡迎與我交流討論！</p>
                </div>
            </div>
        </section>

        <!-- 專案頁面 -->
        <section id="projects" class="section">
            <div class="page-title fade-in">
                <h2>我的專案</h2>
                <p>展示我的程式設計作品和實作專案</p>
            </div>
            <div class="content-grid">
                <!-- 內容將由 JavaScript 動態生成 -->
            </div>
        </section>

        <!-- UVA題庫 -->
        <section id="uva" class="section">
            <div class="page-title fade-in">
                <h2>UVA 題庫練習</h2>
                <p>演算法問題解析和程式碼實現記錄</p>
            </div>
            <div class="content-grid">
                <!-- 內容將由 JavaScript 動態生成 -->
            </div>
        </section>

        <!-- 筆記 -->
        <section id="notes" class="section">
            <div class="page-title fade-in">
                <h2>學習筆記</h2>
                <p>程式設計學習心得和技術筆記整理</p>
            </div>
            <div class="content-grid">
                <!-- 內容將由 JavaScript 動態生成 -->
            </div>
        </section>

        <!-- 心得 -->
        <section id="thoughts" class="section">
            <div class="page-title fade-in">
                <h2>個人心得</h2>
                <p>學習過程的反思和程式設計路上的感悟</p>
            </div>
            <div class="content-grid">
                <!-- 內容將由 JavaScript 動態生成 -->
            </div>
        </section>
    </main>

    <script>
        // 導航功能
        function showSection(sectionId) {
            // 隱藏所有section
            const sections = document.querySelectorAll('.section');
            sections.forEach(section => {
                section.classList.remove('active');
            });

            // 顯示選中的section
            document.getElementById(sectionId).classList.add('active');

            // 更新導航項目狀態
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                item.classList.remove('active');
            });
            event.target.classList.add('active');

            // 重新觸發動畫
            setTimeout(() => {
                const fadeElements = document.querySelectorAll(`#${sectionId} .fade-in`);
                fadeElements.forEach(element => {
                    element.classList.add('visible');
                });
            }, 100);
        }

        // 滾動動畫
        function observeElements() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            });

            document.querySelectorAll('.fade-in').forEach(el => {
                observer.observe(el);
            });
        }

        // 卡片點擊效果
        function addCardClickEffect() {
            document.querySelectorAll('.content-card').forEach(card => {
                card.addEventListener('click', function() {
                    // 這裡可以添加點擊卡片後的行為
                    console.log('Card clicked:', this.querySelector('.card-title').textContent);
                });
            });
        }

        // 導航欄滾動效果
        function handleNavbarScroll() {
            const navbar = document.querySelector('.navbar');
            let lastScrollY = window.scrollY;

            window.addEventListener('scroll', () => {
                const currentScrollY = window.scrollY;
                
                if (currentScrollY > lastScrollY && currentScrollY > 100) {
                    navbar.style.transform = 'translateY(-100%)';
                } else {
                    navbar.style.transform = 'translateY(0)';
                }
                
                lastScrollY = currentScrollY;
            });
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 初始顯示首頁動畫
            setTimeout(() => {
                document.querySelectorAll('#home .fade-in').forEach(element => {
                    element.classList.add('visible');
                });
            }, 300);

            observeElements();
            addCardClickEffect();
            handleNavbarScroll();
        });
    </script>
</body>
</html>
